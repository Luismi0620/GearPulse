events {}

http {
    upstream django_web {
        server django_web:8000;
    }

    upstream health_metrics_service {
        server health_metrics_service:5000;
    }

    server {
        listen 80;
        server_name _;

        # API legado: se conserva en Django durante la migración gradual.
        location /api/v1/ {
            proxy_pass http://django_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruta estrangulada: Flask atiende sólo las métricas de salud v2.
        location /api/v2/health-metrics/ {
            proxy_pass http://health_metrics_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Compatibilidad temporal con los clientes actuales sin prefijo /api/v1/.
        location / {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
