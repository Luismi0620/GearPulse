events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream django_web { server django_web:8000; }
    upstream accounts_api { server accounts_service:5000; }
    upstream subscriptions_api { server subscriptions_service:5000; }
    upstream activity_api { server activity_service:5000; }
    upstream metrics_api { server health_metrics_service:5000; }
    upstream integrations_api { server integration_service:5000; }
    upstream async_api_upstream { server async_api:5000; }

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       '$body_bytes_sent request_time=$request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log gateway;

    server {
        listen 80 default_server;
        server_name _;
        limit_req zone=api_limit burst=40 nodelay;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            return 404;
        }

        location /api/v2/users/ {
            proxy_pass http://accounts_api;
        }
        location /api/v2/plans/ {
            proxy_pass http://subscriptions_api;
        }
        location /api/v2/subscriptions/ {
            proxy_pass http://subscriptions_api;
        }
        location /api/v2/devices/ {
            proxy_pass http://activity_api;
        }
        location /api/v2/health-metrics/ {
            proxy_pass http://metrics_api;
        }
        location /api/v2/integrations/ {
            proxy_pass http://integrations_api;
        }
        location /api/v2/public/ {
            proxy_pass http://integrations_api;
        }
        location /api/v2/tasks/ {
            proxy_pass http://async_api_upstream;
        }
        location /api/v2/notifications/ {
            proxy_pass http://async_api_upstream;
        }
        location /api/v2/reports/ {
            proxy_pass http://async_api_upstream;
        }

        # Django remains only as the web presentation layer during strangulation.
        location / {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
