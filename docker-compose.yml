services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV_TYPE: MOCK
    expose:
      - "8000"
    volumes:
      - django_data:/app/data

  health_metrics_service:
    build:
      context: ./flask_metrics_service
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django_web
      - health_metrics_service
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  django_data:
