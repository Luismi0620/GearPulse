services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gearpulse
      POSTGRES_USER: gearpulse
      POSTGRES_PASSWORD: gearpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearpulse -d gearpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV_TYPE: MOCK
      DB_ENGINE: postgres
      DB_HOST: db
      POSTGRES_DB: gearpulse
      POSTGRES_USER: gearpulse
      POSTGRES_PASSWORD: gearpulse
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  health_metrics_service:
    build:
      context: ./flask_metrics_service
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      django_web:
        condition: service_started
      health_metrics_service:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
