name: GearPulse CI

on:
  push:
    branches: [main, development, entrega2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s services -p "test_*.py"
      - run: python -m unittest flask_metrics_service.test_app
      - run: python manage.py test
      - run: docker compose config --quiet
